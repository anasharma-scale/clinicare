# Saved harbor run config: Gemini 3.1 Pro (gemini-cli) oracle over the MIMIC healthcare answer tasks.
# Build, export and the backend/allowlist rules are in the oracle_opus.yaml header.
#
# LAUNCH
#   uv run harbor run -c construction/configs/oracle_gemini.yaml -e docker \
#       --extra-docker-compose benchmark/tasks_answer/_sidecar.compose.yml \
#       --ae "GEMINI_API_KEY=$GEMINI_API_KEY" \
#       --job-name full_answer_gemini_$(date +%Y%m%d_%H%M%S) --yes
#
#   Against Google's own endpoint that is all you need: generativelanguage.googleapis.com is in
#   the default allowlist build_tasks.py bakes into every task.
#
#   THROUGH A GATEWAY, pass `--ae "GOOGLE_GEMINI_BASE_URL=$GOOGLE_GEMINI_BASE_URL"` explicitly.
#   Unlike claude-code, harbor does NOT forward this one from the ambient shell, so omitting it
#   sends gemini-cli to Google's endpoint instead of your gateway. Note the route differs from the
#   other agents: it ends in .../gemini, not /v1 and not bare. A wrong or unreachable base URL
#   surfaces as
#     TypeError: fetch failed sending request   (at Models.generateContentStream)
#   Check the trial's config.json — agent.env must list it alongside GEMINI_API_KEY.
#
# WEB HARDENING: runs via the repo-local `GeminiNoWeb` agent
# (packages/clinicare_core/src/clinicare_core/agents/gemini_no_web.py), which subclasses harbor's
# GeminiCli and injects gemini-cli's `excludeTools` denylist (google_web_search / web_fetch) into
# the run-time settings.json — harbor exposes no flag for it. Closed-book: external grounding is
# the staged policy corpus, not the open web. Mirrors codex_mcp_fix; delete once harbor adds a
# settings/excludeTools hook.
#
# Secrets stay on the CLI via --ae, never in this file.
job_name: full_answer_gemini
n_attempts: 1
n_concurrent_trials: 10
agents:
  - import_path: clinicare_core.agents.gemini_no_web:GeminiNoWeb
    model_name: gemini/gemini-3.1-pro-preview
datasets:
  - path: benchmark/tasks_answer
artifacts:
  - source: /workspace/report.md
    destination: verifier/report.md
verifier:
  disable: true
