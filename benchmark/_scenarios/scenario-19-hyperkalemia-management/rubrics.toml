# Process rubric for scenario-19 (hyperkalemia-management), authored by the reviewing clinician.
# build_tasks.py bundles it into each task's tests/rubrics.json.
#
# There is deliberately no 'returned the correct label' item: the outcome is scored
# deterministically by judge.py, and duplicating it here would double-count it.
#
# weight: signed points. Positive = MUST-DO (credit when present). Negative = MUST-NOT (penalty).

[[rubric]]
id = "D1"
weight = "+2"
title = "Anchored the 4-h window on the SPECIFIED K event (>/=5.5) ."

[[rubric]]
id = "D2"
weight = "+2"
title = "Checked calcium given for severe hyperkalemia (K ≥ 6.5)."

[[rubric]]
id = "D3"
weight = "+2"
title = "Checked ≥1 shift maneuver with insulin paired to dextrose."

[[rubric]]
id = "D4"
weight = "+2"
title = "Used administration time and reconciled emar vs inputevents capture."

[[rubric]]
id = "D5"
weight = "+1"
title = "Reported the 1/2/4-h potassium response."

[[rubric]]
id = "D6"
weight = "+2"
title = "Checked whether a potassium binder was given as monotherapy for severe hyperkalemia."

[[rubric]]
id = "N1"
weight = "-2"
title = "Anchored to the wrong K event or the whole stay rather than the specified anchor."

[[rubric]]
id = "N2"
weight = "-2"
title = "Used order time instead of administration time."

[[rubric]]
id = "N4"
weight = "-1"
title = "Read the hyperkalemia severity from an ICD code instead of the labevents potassium value."
